apiVersion: helm.sh/v1beta1
kind: HelmChart
metadata:
  name: neo4j
  namespace: cmdb
spec:
  repo: https://neo4j.github.io/helm-charts
  chart: neo4j
  targetNamespace: cmdb
  values:
    neo4j:
      edition: community
      password: password
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

---
apiVersion: helm.sh/v1beta1
kind: HelmChart
metadata:
  name: kafka
  namespace: cmdb
spec:
  repo: https://charts.bitnami.com/bitnami
  chart: kafka
  targetNamespace: cmdb
  values:
    replicas: 3
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
