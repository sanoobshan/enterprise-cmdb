apiVersion: v1
kind: ConfigMap
metadata:
  name: graph-service-config
  namespace: cmdb
data:
  neo4j_uri: "bolt://neo4j:7687"
  kafka_bootstrap: "kafka:9092"
  log_level: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: graph-service-secrets
  namespace: cmdb
type: Opaque
stringData:
  neo4j_user: neo4j
  neo4j_password: password
