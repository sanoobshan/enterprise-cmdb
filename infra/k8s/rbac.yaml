apiVersion: v1
kind: Namespace
metadata:
  name: cmdb
  labels:
    name: cmdb
    environment: production

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmdb-discovery-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmdb-discovery-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cmdb-discovery-role
subjects:
- kind: ServiceAccount
  name: cmdb-discovery
  namespace: cmdb

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmdb-discovery
  namespace: cmdb
