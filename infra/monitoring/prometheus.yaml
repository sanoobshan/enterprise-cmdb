apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cmdb-prometheus
  namespace: cmdb
spec:
  selector:
    matchLabels:
      app: cmdb
  endpoints:
  - port: metrics
    interval: 30s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-cmdb-config
  namespace: cmdb
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    - job_name: 'graph-service'
      static_configs:
      - targets: ['localhost:8000']
    - job_name: 'impact-engine'
      static_configs:
      - targets: ['localhost:8001']
    - job_name: 'neo4j'
      static_configs:
      - targets: ['neo4j:7474']
