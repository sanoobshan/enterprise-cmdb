name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        options: >-
          --health-cmd "curl -f http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      kafka:
        image: bitnami/kafka:latest
        env:
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
        options: >-
          --health-cmd "echo 'broker' | nc localhost 9092 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ --cov=./ --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Graph Service
      uses: docker/build-push-action@v4
      with:
        context: ./services/graph-service
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/graph-service:latest
          ${{ secrets.DOCKER_USERNAME }}/graph-service:${{ github.sha }}
    
    - name: Build and push Event Ingestor
      uses: docker/build-push-action@v4
      with:
        context: ./services/event-ingestor
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/event-ingestor:latest
          ${{ secrets.DOCKER_USERNAME }}/event-ingestor:${{ github.sha }}
    
    - name: Build and push Impact Engine
      uses: docker/build-push-action@v4
      with:
        context: ./services/impact-engine
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/impact-engine:latest
          ${{ secrets.DOCKER_USERNAME }}/impact-engine:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
    
    - name: Deploy to Kubernetes
      run: |
        helm upgrade --install cmdb ./helm/graph-service \
          --namespace cmdb \
          --create-namespace \
          --values helm/graph-service/values.yaml \
          --set image.tag=${{ github.sha }}
    
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/graph-service \
          -n cmdb --timeout=5m
